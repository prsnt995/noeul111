name: NOEUL CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Production dependencies must be audit-clean. Dev-only advisories
      # (vite/vitest/esbuild dev servers, never shipped to production) are
      # tracked in audit/PROJECT_AUDIT.md finding #25, not gated here.
      - run: npm audit --omit=dev --audit-level=moderate
