name: NOEUL CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 required by package.json engines: >=22.12.0
          # (was Node 20; updated to match current engines field and avoid
          # CI failures from version mismatch + missing package-lock.json).
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Production dependencies must be audit-clean. Dev-only advisories
      # (vite/vitest/esbuild dev servers, never shipped to production) are
      # reported separately from the production dependency audit. xlsx has no
      # patched npm release and is documented in scripts/audit-gate.mjs.
      - run: npm audit --omit=dev --json > audit.json || true
      - run: node scripts/audit-gate.mjs audit.json
